name: Build MediaMuster

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

# Keep these versions aligned with CMakeLists.
env:
  APP_VERSION: "0.0.3"
  QT_VERSION: "6.5.3"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: MediaMuster-Mac
          # The Qt compatibility patch is used with the Visual Studio 2022 toolchain.
          - os: windows-2022
            name: MediaMuster-Win
            qt-arch: win64_msvc2019_64

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v7

      - name: Check release tag
        if: github.ref_type == 'tag'
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$APP_VERSION"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt-arch }}
          dir: '${{ runner.temp }}/Qt'
          cache: true

      - name: Patch Qt for MSVC
        if: runner.os == 'Windows'
        run: cmake -P .github/cmake/patch-qt-windows.cmake

      - name: Configure
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            generator_options=(-G "Visual Studio 17 2022" -A x64)
          else
            generator_options=(-G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release)
          fi
          cmake -S . -B build "${generator_options[@]}" "-DCMAKE_PREFIX_PATH=${QT_ROOT_DIR:?Qt installation path is missing}"

      - name: Build
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            build_jobs="${NUMBER_OF_PROCESSORS:-1}"
          else
            build_jobs="$(sysctl -n hw.ncpu 2>/dev/null || echo 1)"
          fi
          cmake --build build --config Release --parallel "$build_jobs"

      - name: Test
        id: test
        run: cmake -P .github/cmake/test.cmake

      - name: Upload test diagnostics
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: test-diagnostics-${{ matrix.name }}
          path: |
            build/Testing/Temporary/*.log
            build/tests/*.result.txt
          if-no-files-found: ignore

      - name: Import code-signing cert
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.MAC_CERTS_BASE64 }}
          p12-password:    ${{ secrets.MAC_CERTS_PASSWORD }}

      - name: Package (macOS)
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        env:
          APPLE_TEAM_ID:     ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID_USERNAME: ${{ secrets.APPLE_ID_USERNAME }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        run: cmake -P .github/cmake/package-macos.cmake

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: cmake -P .github/cmake/package-windows.cmake

      - name: Upload macOS artefact
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: MediaMuster-${{ env.APP_VERSION }}-Mac
          path: build/MediaMuster-${{ env.APP_VERSION }}-Mac.dmg
          if-no-files-found: error

      - name: Upload Windows artefact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: MediaMuster-${{ env.APP_VERSION }}-Win
          path: build/MediaMuster-${{ env.APP_VERSION }}-Win
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artefacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Zip the Windows folder
        working-directory: release-assets
        run: |
          windows_package="MediaMuster-${APP_VERSION}-Win"
          cmake -E tar cf "${windows_package}.zip" --format=zip "$windows_package"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: |
            release-assets/MediaMuster-*-Mac/*.dmg
            release-assets/MediaMuster-*-Win.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
