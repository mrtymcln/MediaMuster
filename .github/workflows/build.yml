name: Build MediaMuster

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

### Versions. The Check the version step holds these to CMakeLists.txt ###
env:
  APP_VERSION: "0.0.2"
  QT_VERSION: "6.5.3"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: MediaMuster-Mac
          ### Pinned image, not a rolling label: the pinned Qt's headers are
          ### patched below for the MSVC that ships on this image, and a
          ### rolling label would move the compiler under that patch. ###
          - os: windows-2022
            name: MediaMuster-Win

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v7

      ### Every version is written out by hand; stop early if any two disagree ###
      - name: Check the version
        shell: bash
        run: |
          grep -q "^project(MediaMuster VERSION ${APP_VERSION} " CMakeLists.txt \
            || { echo "APP_VERSION ${APP_VERSION} is not the project() version in CMakeLists.txt"; exit 1; }
          grep -q "^find_package(Qt6 ${QT_VERSION} EXACT " CMakeLists.txt \
            || { echo "QT_VERSION ${QT_VERSION} is not the Qt pin in CMakeLists.txt"; exit 1; }
          grep -q "^find_package(Qt6 ${QT_VERSION} EXACT " tests/CMakeLists.txt \
            || { echo "QT_VERSION ${QT_VERSION} is not the Qt pin in tests/CMakeLists.txt"; exit 1; }
          grep -q "Qt/${QT_VERSION}/macos" CMakeLists.txt \
            || { echo "QT_VERSION ${QT_VERSION} is not the local Qt path in CMakeLists.txt"; exit 1; }
          [ "$GITHUB_REF_TYPE" != tag ] || [ "${GITHUB_REF_NAME#v}" = "${APP_VERSION}" ] \
            || { echo "tag ${GITHUB_REF_NAME} is not APP_VERSION ${APP_VERSION}"; exit 1; }

      ### Install Qt ###
      - name: Install Qt (macOS)
        if: runner.os == 'macOS'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'mac'
          target: 'desktop'
          dir: '${{ runner.temp }}/Qt'
          cache: true

      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          dir: '${{ runner.temp }}\Qt'
          cache: true

      - name: Patch Qt for modern MSVC (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = if ($env:QT_ROOT_DIR) { $env:QT_ROOT_DIR } else { "$env:RUNNER_TEMP\Qt\Qt\$env:QT_VERSION\msvc2019_64" }
          $h = Join-Path $root 'include\QtCore\qcompilerdetection.h'
          $c = Get-Content $h -Raw
          $c = $c.Replace('stdext::make_unchecked_array_iterator(x)', '(x)')
          $c = $c.Replace('stdext::make_checked_array_iterator(x, size_t(N))', '(x)')
          Set-Content $h $c -NoNewline

      ### Build (macOS). Minimum macOS and the arm64+x86_64 pair are CMakeLists.txt
      ### defaults, so they are not repeated here ###
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          EXTRA=""
          if [[ "$GITHUB_REF_NAME" =~ ^v0\. ]]; then EXTRA="-DSELF_DESTRUCT=ON"; fi
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release \
                   -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}" \
                   $EXTRA
          cmake --build . --config Release --parallel $(sysctl -n hw.ncpu)

      ### Build (Windows) ###
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          $extra = @()
          if ($env:GITHUB_REF_NAME -match '^v0\.') { $extra += '-DSELF_DESTRUCT=ON' }
          mkdir build
          cd build
          cmake .. -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" @extra
          cmake --build . --config Release --parallel $env:NUMBER_OF_PROCESSORS

      ### Test (macOS and Windows) ###
      - name: Test (macOS and Windows)
        run: ctest --test-dir build -C Release --output-on-failure

      ### --output-on-failure prints nothing for a failing Windows test; ctest always writes this ###
      - name: Test log (on failure)
        if: failure() && hashFiles('build/Testing/Temporary/LastTest.log') != ''
        shell: bash
        run: cat build/Testing/Temporary/LastTest.log

      ### The per-test result files are the only reliable record on Windows, ###
      ### where ctest captures no test stdout at all ###
      - name: Test results (on failure)
        if: failure()
        shell: bash
        run: |
          for f in build/tests/*.result.txt build/tests/Release/*.result.txt; do
            [ -f "$f" ] || continue
            echo "===== $f ====="
            cat "$f"
          done

      ### Code signing certificate (macOS) ###
      - name: Import code-signing cert
        if: runner.os == 'macOS' && env.MAC_CERTS_BASE64 != ''
        env:
          MAC_CERTS_BASE64: ${{ secrets.MAC_CERTS_BASE64 }}
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.MAC_CERTS_BASE64 }}
          p12-password:    ${{ secrets.MAC_CERTS_PASSWORD }}

      ### Package (macOS) ###
      - name: Package (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_TEAM_ID:     ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID_USERNAME: ${{ secrets.APPLE_ID_USERNAME }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        run: |
          cd build

          DMG="MediaMuster-${APP_VERSION}-Mac.dmg"

          macdeployqt MediaMuster.app

          APP=MediaMuster.app
          PLUG="$APP/Contents/PlugIns"
          FW="$APP/Contents/Frameworks"
          ### SVG and the image formats are leftovers from the old custom-button UI ###
          for gone in "$PLUG/imageformats" "$PLUG/iconengines" "$PLUG/generic" \
                      "$PLUG/tls" "$PLUG/networkinformation" \
                      "$FW/QtSvg.framework" "$FW/QtNetwork.framework"; do
            rm -rf "$gone"
            [ ! -e "$gone" ] || { echo "$gone survived the strip"; exit 1; }
          done

          missing=0
          while IFS= read -r bin; do
            for dep in $(otool -L "$bin" 2>/dev/null | awk '/@rpath\/Qt/ {print $1}' \
                         | sed 's#@rpath/##; s#\.framework.*##' | sort -u); do
              if [ ! -d "$FW/$dep.framework" ]; then
                echo "MISSING framework: $dep (linked by $bin)"
                missing=1
              fi
            done
          done < <(find "$APP" -type f \( -perm -111 -o -name "*.dylib" \))
          if [ "$missing" -ne 0 ]; then
            echo "Qt framework trim broke a dependency"
            exit 1
          fi

          build_dmg() {
            local STAGING="$RUNNER_TEMP/dmg-staging"
            rm -rf "$STAGING"
            mkdir -p "$STAGING"
            cp -R MediaMuster.app "$STAGING/"
            ln -s /Applications "$STAGING/Applications"
            sync
            sleep 4
            rm -f "$DMG"
            hdiutil create -volname "MediaMuster" -srcfolder "$STAGING" -ov -format ULMO "$DMG"
            rm -rf "$STAGING"
          }

          IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/' || true)

          if [ -n "$IDENTITY" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "── Real Developer ID signing + notarization ──"
            ### Nested-first: --deep is deprecated for signing ###
            find "$APP/Contents/Frameworks" -maxdepth 1 -name "*.framework" \
              -exec codesign --force --options runtime --timestamp --sign "$IDENTITY" {} \;
            find "$APP/Contents/PlugIns" -name "*.dylib" \
              -exec codesign --force --options runtime --timestamp --sign "$IDENTITY" {} \;
            codesign --force --options runtime --timestamp --sign "$IDENTITY" "$APP"
            codesign --verify --deep --strict --verbose=2 "$APP"
            sync
            sleep 2
            build_dmg
            xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID_USERNAME" --password "$APPLE_ID_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$DMG"
            xcrun stapler validate "$DMG"
          else
            echo "── No signing identity available — ad-hoc signature ──"
            find "$APP/Contents/Frameworks" -maxdepth 1 -name "*.framework" \
              -exec codesign --force --sign - {} \;
            find "$APP/Contents/PlugIns" -name "*.dylib" \
              -exec codesign --force --sign - {} \;
            codesign --force --sign - "$APP"
            build_dmg
          fi

      ### Package (Windows) ###
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd build
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item -Path Release\MediaMuster.exe -Destination dist\

          windeployqt --release --no-translations --no-opengl-sw --no-system-d3d-compiler dist\MediaMuster.exe

          ### SVG and the image formats are leftovers from the old custom-button UI ###
          $strip = @('Qt6Network.dll', 'Qt6Svg.dll', 'tls', 'networkinformation',
                     'generic', 'iconengines', 'imageformats')
          foreach ($item in $strip) {
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "dist\$item"
            if (Test-Path "dist\$item") { throw "$item survived the strip" }
          }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory | Select-Object -Last 1
          if (-not $crt) { throw "VC++ CRT redist folder not found under $vs" }
          $keep = @('msvcp140.dll', 'msvcp140_1.dll', 'msvcp140_2.dll',
                    'msvcp140_atomic_wait.dll', 'msvcp140_codecvt_ids.dll',
                    'vcruntime140.dll', 'vcruntime140_1.dll')
          foreach ($dll in $keep) {
            $src = Join-Path $crt.FullName $dll
            if (-not (Test-Path $src)) { throw "Expected CRT DLL missing from redist: $dll" }
            Copy-Item $src dist\
          }

          Rename-Item dist "MediaMuster-${env:APP_VERSION}-Win"

      ### Upload artefacts ###
      - name: Upload macOS artefact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: MediaMuster-${{ env.APP_VERSION }}-Mac
          path: build/MediaMuster-${{ env.APP_VERSION }}-Mac.dmg

      - name: Upload Windows artefact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: MediaMuster-${{ env.APP_VERSION }}-Win
          path: build/MediaMuster-${{ env.APP_VERSION }}-Win

  ### Push to Releases if tagged ###
  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    ### The only job that writes to the Releases page ###
    permissions:
      contents: write
    steps:
      - name: Download all artefacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Zip the Windows folder
        run: |
          cd release-assets
          ### Each artefact lands in its own subdir; the Windows folder ships as one zip ###
          zip -r "MediaMuster-${APP_VERSION}-Win.zip" "MediaMuster-${APP_VERSION}-Win"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          files: |
            release-assets/MediaMuster-*-Mac/*.dmg
            release-assets/MediaMuster-*-Win.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}