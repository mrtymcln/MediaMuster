name: Build MediaMuster

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

### Versions. The Check the version step holds these to CMakeLists.txt ###
env:
  APP_VERSION: "0.0.2"
  QT_VERSION: "6.5.3"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: MediaMuster-Mac
            qt-host: mac
            qt-arch: ''
          ### Pinned image, not a rolling label: the pinned Qt's headers are
          ### patched below for the MSVC that ships on this image, and a
          ### rolling label would move the compiler under that patch. ###
          - os: windows-2022
            name: MediaMuster-Win
            qt-host: windows
            qt-arch: win64_msvc2019_64

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v7

      ### Every version is written out by hand; stop early if any two disagree ###
      - name: Check the version
        run: cmake -P .github/cmake/check-versions.cmake

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.qt-host }}
          target: 'desktop'
          arch: ${{ matrix.qt-arch }}
          dir: '${{ runner.temp }}/Qt'
          cache: true

      - name: Patch Qt for modern MSVC (Windows)
        if: runner.os == 'Windows'
        run: cmake -P .github/cmake/patch-qt-windows.cmake

      - name: Build (macOS and Windows)
        run: cmake -P .github/cmake/build.cmake

      ### Test (macOS and Windows) ###
      - name: Test (macOS and Windows)
        run: cmake -P .github/cmake/test.cmake

      - name: Upload test diagnostics (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-diagnostics-${{ matrix.name }}
          path: |
            build/Testing/Temporary/*.log
            build/tests/*.result.txt
            build/tests/Release/*.result.txt
          if-no-files-found: ignore

      ### Code signing certificate (macOS) ###
      - name: Import code-signing cert
        if: runner.os == 'macOS' && env.MAC_CERTS_BASE64 != ''
        env:
          MAC_CERTS_BASE64: ${{ secrets.MAC_CERTS_BASE64 }}
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.MAC_CERTS_BASE64 }}
          p12-password:    ${{ secrets.MAC_CERTS_PASSWORD }}

      ### Package (macOS) ###
      - name: Package (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_TEAM_ID:     ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID_USERNAME: ${{ secrets.APPLE_ID_USERNAME }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        run: cmake -P .github/cmake/package-macos.cmake

      ### Package (Windows) ###
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: cmake -P .github/cmake/package-windows.cmake

      ### Upload artefacts ###
      - name: Upload macOS artefact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: MediaMuster-${{ env.APP_VERSION }}-Mac
          path: build/MediaMuster-${{ env.APP_VERSION }}-Mac.dmg

      - name: Upload Windows artefact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: MediaMuster-${{ env.APP_VERSION }}-Win
          path: build/MediaMuster-${{ env.APP_VERSION }}-Win

  ### Push to Releases if tagged ###
  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    ### The only job that writes to the Releases page ###
    permissions:
      contents: write
    steps:
      - name: Download all artefacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Zip the Windows folder
        working-directory: release-assets
        run: cmake -E tar cf "MediaMuster-${{ env.APP_VERSION }}-Win.zip" --format=zip "MediaMuster-${{ env.APP_VERSION }}-Win"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          files: |
            release-assets/MediaMuster-*-Mac/*.dmg
            release-assets/MediaMuster-*-Win.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
