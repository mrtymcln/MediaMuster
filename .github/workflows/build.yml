name: Build MediaMuster

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

### Grant permission to write to the Releases page ###
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: MediaMuster-Mac
          ### Pinned image, not a rolling label: the pinned Qt's headers are
          ### patched below for the MSVC that ships on this image, and a
          ### rolling label would move the compiler under that patch. ###
          - os: windows-2022
            name: MediaMuster-Win

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v6

      ### Versions come from CMakeLists.txt, the one place they are written:
      ### the app version from project(), the Qt release from MEDIAMUSTER_QT_VERSION ###
      - name: Read versions from CMakeLists.txt
        shell: bash
        run: |
          echo "APP_VERSION=$(sed -nE 's/^project\(MediaMuster VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)" >> "$GITHUB_ENV"
          echo "QT_VERSION=$(sed -nE 's/^set\(MEDIAMUSTER_QT_VERSION ([0-9.]+)\).*/\1/p' CMakeLists.txt)" >> "$GITHUB_ENV"

      ### Install Qt ###
      - name: Install Qt (macOS)
        if: runner.os == 'macOS'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'mac'
          target: 'desktop'
          dir: '${{ runner.temp }}/Qt'
          cache: true

      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          dir: '${{ runner.temp }}\Qt'
          cache: true

      - name: Patch Qt for modern MSVC (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = if ($env:QT_ROOT_DIR) { $env:QT_ROOT_DIR } else { "$env:RUNNER_TEMP\Qt\Qt\$env:QT_VERSION\msvc2019_64" }
          $h = Join-Path $root 'include\QtCore\qcompilerdetection.h'
          $c = Get-Content $h -Raw
          $c = $c.Replace('stdext::make_unchecked_array_iterator(x)', '(x)')
          $c = $c.Replace('stdext::make_checked_array_iterator(x, size_t(N))', '(x)')
          Set-Content $h $c -NoNewline

      ### Build (macOS). Minimum macOS and the arm64+x86_64 pair are CMakeLists.txt
      ### defaults, so they are not repeated here ###
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          EXTRA=""
          if [[ "$GITHUB_REF_NAME" =~ ^v0\. ]]; then EXTRA="-DSELF_DESTRUCT=ON"; fi
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release \
                   -DCMAKE_PREFIX_PATH="${Qt6_DIR}" \
                   $EXTRA
          cmake --build . --config Release --parallel $(sysctl -n hw.ncpu)

      ### Build (Windows) ###
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          $extra = @()
          if ($env:GITHUB_REF_NAME -match '^v0\.') { $extra += '-DSELF_DESTRUCT=ON' }
          mkdir build
          cd build
          cmake .. -DCMAKE_PREFIX_PATH="$env:Qt6_DIR" @extra
          cmake --build . --config Release --parallel $env:NUMBER_OF_PROCESSORS

      ### Test (macOS and Windows) ###
      - name: Test (macOS and Windows)
        run: ctest --test-dir build -C Release --output-on-failure

      ### --output-on-failure printed nothing for the failing Windows tests
      ### (2026-08-17), which left a red build with no way to tell what broke.
      ### ctest always writes every test's output here, so dump it. ###
      - name: Test log (on failure)
        if: failure()
        shell: bash
        run: cat build/Testing/Temporary/LastTest.log

      ### Code signing certificate (macOS) ###
      - name: Import code-signing cert
        if: runner.os == 'macOS' && env.MAC_CERTS_BASE64 != ''
        env:
          MAC_CERTS_BASE64: ${{ secrets.MAC_CERTS_BASE64 }}
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.MAC_CERTS_BASE64 }}
          p12-password:    ${{ secrets.MAC_CERTS_PASSWORD }}

      ### Package (macOS) ###
      - name: Package (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_TEAM_ID:     ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID_USERNAME: ${{ secrets.APPLE_ID_USERNAME }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        run: |
          set -e
          cd build

          DMG="MediaMuster-${APP_VERSION}-Mac.dmg"

          macdeployqt MediaMuster.app

          APP=MediaMuster.app
          PLUG="$APP/Contents/PlugIns"
          FW="$APP/Contents/Frameworks"
          rm -rf "$PLUG/imageformats" "$PLUG/iconengines" "$PLUG/generic" \
                 "$PLUG/tls" "$PLUG/networkinformation"
          rm -rf "$FW/QtSvg.framework" "$FW/QtNetwork.framework"

          missing=0
          while IFS= read -r bin; do
            for dep in $(otool -L "$bin" 2>/dev/null | awk '/@rpath\/Qt/ {print $1}' \
                         | sed 's#@rpath/##; s#\.framework.*##' | sort -u); do
              if [ ! -d "$FW/$dep.framework" ]; then
                echo "MISSING framework: $dep (linked by $bin)"
                missing=1
              fi
            done
          done < <(find "$APP" -type f \( -perm -111 -o -name "*.dylib" \))
          if [ "$missing" -ne 0 ]; then
            echo "Qt framework trim broke a dependency"
            exit 1
          fi

          build_dmg() {
            local STAGING="$RUNNER_TEMP/dmg-staging"
            rm -rf "$STAGING"
            mkdir -p "$STAGING"
            cp -R MediaMuster.app "$STAGING/"
            ln -s /Applications "$STAGING/Applications"
            sync
            sleep 4
            rm -f "$DMG"
            hdiutil create -volname "MediaMuster" -srcfolder "$STAGING" -ov -format ULMO "$DMG"
            rm -rf "$STAGING"
          }

          IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/' || true)

          if [ -n "$IDENTITY" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "── Real Developer ID signing + notarization ──"
            # Nested-first, no --deep: --deep is deprecated. Sign every
            # embedded framework and plugin macdeployqt added, then the app.
            APP=MediaMuster.app
            find "$APP/Contents/Frameworks" -maxdepth 1 -name "*.framework" \
              -exec codesign --force --options runtime --timestamp --sign "$IDENTITY" {} \;
            find "$APP/Contents/PlugIns" -name "*.dylib" \
              -exec codesign --force --options runtime --timestamp --sign "$IDENTITY" {} \;
            codesign --force --options runtime --timestamp --sign "$IDENTITY" "$APP"
            codesign --verify --deep --strict --verbose=2 "$APP"
            sync
            sleep 2
            build_dmg
            xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID_USERNAME" --password "$APPLE_ID_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$DMG"
            xcrun stapler validate "$DMG"
          else
            echo "── No signing identity available — ad-hoc signature ──"
            codesign --force --deep --sign - MediaMuster.app
            build_dmg
          fi

      ### Package (Windows) ###
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $appVersion = $env:APP_VERSION
          if (-not $appVersion) { throw "APP_VERSION not set" }

          cd build
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item -Path Release\MediaMuster.exe -Destination dist\

          windeployqt --release --no-translations --no-opengl-sw --no-system-d3d-compiler dist\MediaMuster.exe

          Remove-Item -Force -ErrorAction SilentlyContinue dist\Qt6Network.dll
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue dist\tls
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue dist\networkinformation
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue dist\generic
          if (Test-Path dist\Qt6Network.dll) { throw "Qt6Network.dll survived the strip" }
          Remove-Item -Force -ErrorAction SilentlyContinue dist\Qt6Svg.dll
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue dist\iconengines
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue dist\imageformats
          if (Test-Path dist\Qt6Svg.dll) { throw "Qt6Svg.dll survived the strip" }
          if (Test-Path dist\imageformats) { throw "imageformats survived the strip" }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory | Select-Object -Last 1
          if (-not $crt) { throw "VC++ CRT redist folder not found under $vs" }
          $keep = @('msvcp140.dll', 'msvcp140_1.dll', 'msvcp140_2.dll',
                    'msvcp140_atomic_wait.dll', 'msvcp140_codecvt_ids.dll',
                    'vcruntime140.dll', 'vcruntime140_1.dll')
          foreach ($dll in $keep) {
            $src = Join-Path $crt.FullName $dll
            if (-not (Test-Path $src)) { throw "Expected CRT DLL missing from redist: $dll" }
            Copy-Item $src dist\
          }

          Rename-Item dist "MediaMuster-$appVersion-Win"

      ### Upload artefacts ###
      - name: Upload macOS artefact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: MediaMuster-${{ env.APP_VERSION }}-Mac
          path: build/MediaMuster-${{ env.APP_VERSION }}-Mac.dmg

      - name: Upload Windows artefact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: MediaMuster-${{ env.APP_VERSION }}-Win
          path: build/MediaMuster-${{ env.APP_VERSION }}-Win

  ### Push to Releases if tagged ###
  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artefacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Zip the Windows folder
        run: |
          cd release-assets
          # Each artefact downloaded into its own subdir; wrap the Windows app
          # folder into a single versioned zip for the release.
          zip -r "MediaMuster-${GITHUB_REF_NAME#v}-Win.zip" "MediaMuster-${GITHUB_REF_NAME#v}-Win"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          files: |
            release-assets/MediaMuster-*-Mac/*.dmg
            release-assets/MediaMuster-*-Win.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}